# G1 Syntax & Lint Guard. Rule set fixed before implementation (Constitution IV and VI).
line-length = 100
target-version = "py310"
# Lets import sorting recognise the application package as first-party.
src = ["../src"]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (unused names, undefined names, syntax-level errors)
    "I",        # import order
    "N",        # naming
    "B",        # bugbear (likely bugs)
    "C90",      # cyclomatic complexity
    "UP",       # modern Python idioms
    "SIM",      # simplifications
    "D",        # docstrings on public code
    "ANN",      # type hints
]

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Tests are named after the acceptance scenario they check; they do not need
# docstrings or annotations. No rule is relaxed for production code in src/.
"tests/**" = ["D", "ANN"]
